name: Publish HTTP server release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Test and validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run type checks
        run: python -m mypy --pretty src examples tests

      - name: Run lint checks
        run: python -m pylint src examples tests

      - name: Check formatting
        run: |
          python -m isort --check-only --diff .
          python -m black --check --diff .

  windows:
    name: Build Windows x64 release
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and PyInstaller
        run: python -m pip install . pyinstaller

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: ./build_windows_release.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: releases/windows/edge-tts-server-windows-x64.zip
          if-no-files-found: error

  docker:
    name: Publish multi-platform Docker image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs:
      - validate
      - windows
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Render release deployment guide
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          sed -e "s|__IMAGE__|${IMAGE}|g" -e "s|__VERSION__|${VERSION}|g" \
            .github/release-notes.md > release-notes.rendered.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body >> release-notes.rendered.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/edge-tts-server-windows-x64.zip#Windows x64 standalone server" \
            --verify-tag \
            --title "Edge TTS HTTP Server ${VERSION}" \
            --notes-file release-notes.rendered.md
