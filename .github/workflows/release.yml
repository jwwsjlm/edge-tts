name: Publish HTTP server release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish (vX.Y.Z)
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and validate stable tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate tag against package version
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only stable vX.Y.Z tags can be released: $RELEASE_TAG" >&2
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          package_version="$(python - <<'PY'
          import runpy
          print(runpy.run_path("src/edge_tts/version.py")["__version__"])
          PY
          )"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $tag_version does not match package $package_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build the workspace
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting
        run: |
          python -m black --check --diff .
          python -m isort --check-only --diff .

      - name: Run type checks
        run: python -m mypy --pretty src examples tests

      - name: Run lint checks
        run: python -m pylint src examples tests

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-static
          path: src/edge_tts_server/static
          if-no-files-found: error

  windows:
    name: Build Windows x64 release
    needs: validate
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up Python 3.14 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install runtime and PyInstaller
        run: python -m pip install . pyinstaller

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: ./build_windows_release.ps1

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            releases/windows/edge-tts-windows-x64.zip
          if-no-files-found: error

  windows_python:
    name: Build Windows Python 3.14 runtime bundle
    needs: validate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
      - name: Build native Windows Python bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-static
          path: src/edge_tts_server/static
      - name: Package native Windows Python bundle
        run: python packaging/python/build_bundle.py release-assets
      - name: Extract and smoke-test isolated Windows Python bundle
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath release-assets/edge-tts-windows-x64-python314.zip -DestinationPath smoke
          python packaging/python/smoke_test.py smoke/edge-tts-windows-x64-python314
          if ($LASTEXITCODE -ne 0) { throw "Python bundle smoke test failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-python-release
          path: release-assets/edge-tts-windows-x64-python314.zip
          if-no-files-found: error

  python_bundle:
    name: Build clean Python 3.14 runtime bundle
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          name: frontend-static
          path: src/edge_tts_server/static

      - name: Build clean Python 3.14 runtime bundle
        shell: bash
        run: |
          mkdir -p release-assets
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspace" --workdir /workspace \
            python:3.14-slim \
            python3.14 packaging/python/build_bundle.py release-assets

      - name: Smoke-test clean Python bundle without network
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -rf edge-tts-linux-amd64-python314
          tar -xzf edge-tts-linux-amd64-python314.tar.gz
          cp edge-tts-linux-amd64-python314/config.example.yaml \
            edge-tts-linux-amd64-python314/config.yaml
          docker run --rm --network none --platform linux/amd64 \
            --volume "$PWD/edge-tts-linux-amd64-python314:/bundle" \
            --workdir /bundle python:3.14-slim sh -euc '
              python3.14 run.py >/tmp/server.log 2>&1 &
              server_pid=$!
              trap "kill $server_pid 2>/dev/null || true" EXIT
              for attempt in $(seq 1 40); do
                if python3.14 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5050/health\", timeout=1).read(); assert b\"id=\\\"app\\\"\" in urllib.request.urlopen(\"http://127.0.0.1:5050/\", timeout=1).read()"; then
                  exit 0
                fi
                sleep 0.25
              done
              cat /tmp/server.log
              exit 1
            '

      - name: Upload clean Python bundle
        uses: actions/upload-artifact@v7
        with:
          name: python-runtime-release
          path: release-assets/edge-tts-linux-amd64-python314.tar.gz
          if-no-files-found: error

  docker:
    name: Verify and publish Docker images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build loadable native amd64 image
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag "$IMAGE:$VERSION" \
            .

      - name: Smoke-test native amd64 image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f edge-tts-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name edge-tts-smoke \
            --publish 127.0.0.1:5050:5050 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --init \
            --volume "$PWD/config.example.yaml:/config/config.yaml:ro" \
            "$IMAGE:$VERSION"
          health_code=""
          for _ in {1..60}; do
            health_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:5050/health || true)"
            [[ "$health_code" == "200" ]] && break
            sleep 1
          done
          if [[ "$health_code" != "200" ]]; then
            docker logs edge-tts-smoke
            exit 1
          fi
          unauthorized_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"text":"release smoke test"}' \
            http://127.0.0.1:5050/v1/tts)"
          [[ "$unauthorized_code" == "401" ]]
          curl --fail --silent http://127.0.0.1:5050/ | grep 'id="app"'

      - name: Export offline amd64 image
        shell: bash
        run: |
          mkdir -p release-assets
          docker save "$IMAGE:$VERSION" | gzip -9 \
            > release-assets/edge-tts-linux-amd64-docker-offline.tar.gz

      - name: Reload offline amd64 image
        shell: bash
        run: |
          docker image rm "$IMAGE:$VERSION"
          gzip --decompress --stdout release-assets/edge-tts-linux-amd64-docker-offline.tar.gz \
            | docker load

      - name: Smoke-test reloaded offline image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f edge-tts-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name edge-tts-smoke \
            --publish 127.0.0.1:5050:5050 \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --init \
            --volume "$PWD/config.example.yaml:/config/config.yaml:ro" \
            "$IMAGE:$VERSION"
          health_code=""
          for _ in {1..60}; do
            health_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:5050/health || true)"
            [[ "$health_code" == "200" ]] && break
            sleep 1
          done
          if [[ "$health_code" != "200" ]]; then
            docker logs edge-tts-smoke
            exit 1
          fi
          unauthorized_code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --data '{"text":"release smoke test"}' \
            http://127.0.0.1:5050/v1/tts)"
          [[ "$unauthorized_code" == "401" ]]

      - name: Upload offline amd64 image
        uses: actions/upload-artifact@v7
        with:
          name: docker-offline-release
          path: release-assets/edge-tts-linux-amd64-docker-offline.tar.gz
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs:
      - validate
      - windows
      - python_bundle
      - windows_python
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Download Windows Python bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-python-release
          path: release-assets

      - name: Download Windows release ZIP
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release-assets

      - name: Download offline amd64 image
        uses: actions/download-artifact@v8
        with:
          name: docker-offline-release
          path: release-assets

      - name: Download clean Python bundle
        uses: actions/download-artifact@v8
        with:
          name: python-runtime-release
          path: release-assets

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          expected_assets=$'edge-tts-linux-amd64-docker-offline.tar.gz\nedge-tts-linux-amd64-python314.tar.gz\nedge-tts-windows-x64.zip\nedge-tts-windows-x64-python314.zip'
          actual_assets="$(find . -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "$actual_assets" != "$(printf '%s\n' "$expected_assets" | sort)" ]]; then
            echo "Unexpected release files:" >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          fi
          sha256sum \
            edge-tts-windows-x64.zip \
            edge-tts-windows-x64-python314.zip \
            edge-tts-linux-amd64-python314.tar.gz \
            edge-tts-linux-amd64-docker-offline.tar.gz \
            | sort --key=2 > SHA256SUMS.txt

      - name: Render release deployment guide
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          sed -e "s|__IMAGE__|${IMAGE}|g" -e "s|__VERSION__|${VERSION}|g" \
            .github/release-notes.md > release-notes.rendered.md
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body >> release-notes.rendered.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/edge-tts-windows-x64.zip#Windows x64 | ZIP | EXE + config.example.yaml" \
            "release-assets/edge-tts-windows-x64-python314.zip#Windows x64 | Python 3.14 bundle" \
            "release-assets/edge-tts-linux-amd64-python314.tar.gz#Linux amd64 | Python 3.14 bundle" \
            "release-assets/edge-tts-linux-amd64-docker-offline.tar.gz#Linux amd64 | Docker offline image | 1Panel" \
            "release-assets/SHA256SUMS.txt#SHA-256 checksums" \
            --verify-tag \
            --title "Edge TTS + Xiaomi MiMo ${VERSION} | Windows + Linux + Docker" \
            --notes-file release-notes.rendered.md

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image to latest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
