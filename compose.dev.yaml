services:
  edge-tts:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-tts-http:local
    container_name: edge-tts
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "5050:5050"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    dns:
      - 223.5.5.5
      - 119.29.29.29
